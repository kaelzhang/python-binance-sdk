[build-system]
# Minimum requirements for the build system to execute.
# See https://github.com/scipy/scipy/pull/12940 for the AIX issue.

# Should sync to [project.optional-dependencies]
requires = [
  "setuptools",
  "build"
]

build-backend = "setuptools.build_meta"

[project]
name = 'binance-sdk'
dynamic = ['version']
description='Binance Python SDK'
readme = 'docs/README.md'
authors = [
  { name = 'Master God', email='you-dont-know-who@gmail.com' }
]
license-files = ['LICENSE']
requires-python = '>=3.11'
dependencies = [
  "aiohttp >= 3.9",
  "aioretry >= 6.0.0",
  "websockets >= 15.0.0",
  "stock-pandas >= 5.4.2",
  "cryptography >= 41"
]
classifiers=[
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: Implementation :: CPython',
    'Natural Language :: English',
    'Intended Audience :: Developers',
    'Intended Audience :: Financial and Insurance Industry',
    'Operating System :: OS Independent',
    'Development Status :: 4 - Beta',
    'Topic :: Utilities'
]

[project.urls]
Homepage = "https://github.com/mastergod/binance-sdk"

[project.optional-dependencies]
dev = [
  "codecov",
  "coverage",
  "ruff",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-timeout",
  "aioresponses",
  "python-dotenv",
  "twine",
  "setuptools",
  "mypy",
  "build"
]

[tool.setuptools.packages.find]
# Automatically discover every subpackage under `binance/` that has an
# `__init__.py`. This replaces the previous hand-maintained explicit list,
# which silently went stale every time a module was split into a subpackage
# (e.g. the R8 series adding `binance.spot.endpoints`, `binance.futures.streams`,
# `binance.futures.{um,cm}.endpoints` and their `getters/` subpackages — none
# of which made it into the 5.0.0 / 5.0.1 wheels, breaking `import binance`
# downstream). Auto-discovery removes that footgun entirely.
include = ["binance*"]
# `binance/no_track/` is a gitignored scratch directory for local drafts
# (also excluded from mypy via `[tool.mypy].exclude`). Excluding it here
# defends against the same path accidentally being added to a published
# package if a developer commits part of that directory.
exclude = ["binance.no_track*"]

[tool.setuptools.dynamic]
version = {attr = "binance.__version__"}

# [tool.setuptools.package-data]
# stock_pandas = [
#   "py.typed"
# ]

[tool.mypy]
warn_return_any = true
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
disable_error_code = ['return-value', 'no-any-return', 'empty-body']
# `binance/no_track/` holds gitignored local drafts (intentionally not part of
# the package) that contain incomplete/invalid syntax; without this exclude a
# bare `mypy binance/` aborts on them and never type-checks the real code.
exclude = ['(^|/)no_track/']

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "live: tests that hit the real Binance API (skipped unless BINANCE_LIVE=1)",
]
# A test must never hang forever: kill any test that runs longer than this
# many seconds and dump the stack of where it was stuck, so failures are
# diagnosable from the output instead of freezing the whole run.
timeout = 30
# Surface WARNING/ERROR logs (e.g. websocket reconnect/connection errors)
# both on stdout during the run AND to a log file for later inspection.
log_cli = true
log_cli_level = "WARNING"
log_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_file = "test-errors.log"
log_file_level = "WARNING"
log_file_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
