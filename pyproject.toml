[build-system]
# Minimum requirements for the build system to execute.
# See https://github.com/scipy/scipy/pull/12940 for the AIX issue.

# Should sync to [project.optional-dependencies]
requires = [
  "setuptools",
  "build"
]

build-backend = "setuptools.build_meta"

[project]
name = 'binance-sdk'
dynamic = ['version']
description='Binance Python SDK'
readme = 'docs/README.md'
authors = [
  { name = 'Master God', email='you-dont-know-who@gmail.com' }
]
license-files = ['LICENSE']
requires-python = '>=3.9'
dependencies = [
  "aiohttp >= 3.9",
  "aioretry >= 6.0.0",
  "websockets >= 15.0.0",
  "stock-pandas >= 5.4.2",
  "cryptography >= 41"
]
classifiers=[
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: Implementation :: CPython',
    'Natural Language :: English',
    'Intended Audience :: Developers',
    'Intended Audience :: Financial and Insurance Industry',
    'Operating System :: OS Independent',
    'Development Status :: 4 - Beta',
    'Topic :: Utilities'
]

[project.urls]
Homepage = "https://github.com/mastergod/binance-sdk"

[project.optional-dependencies]
dev = [
  "codecov",
  "coverage",
  "ruff",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-timeout",
  "aioresponses",
  "python-dotenv",
  "twine",
  "setuptools",
  "mypy",
  "build"
]

[tool.setuptools]
packages = [
  'binance',
  'binance.apis',
  'binance.client',
  'binance.common',
  'binance.handlers',
  'binance.processors',
  'binance.rate_limit',
  'binance.subscribe'
]

[tool.setuptools.dynamic]
version = {attr = "binance.__version__"}

# [tool.setuptools.package-data]
# stock_pandas = [
#   "py.typed"
# ]

[tool.mypy]
warn_return_any = true
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
disable_error_code = ['return-value', 'no-any-return', 'empty-body']
# `binance/no_track/` holds gitignored local drafts (intentionally not part of
# the package) that contain incomplete/invalid syntax; without this exclude a
# bare `mypy binance/` aborts on them and never type-checks the real code.
exclude = ['(^|/)no_track/']

[tool.pytest.ini_options]
asyncio_mode = "strict"
# A test must never hang forever: kill any test that runs longer than this
# many seconds and dump the stack of where it was stuck, so failures are
# diagnosable from the output instead of freezing the whole run.
timeout = 30
# Surface WARNING/ERROR logs (e.g. websocket reconnect/connection errors)
# both on stdout during the run AND to a log file for later inspection.
log_cli = true
log_cli_level = "WARNING"
log_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
log_file = "test-errors.log"
log_file_level = "WARNING"
log_file_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"
